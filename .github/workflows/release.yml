# On version tag push: build ad-hoc Release .app, zip + polished DMG (dmgbuild), publish a GitHub Release.
name: Release build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install dmgbuild (DMG window layout without Finder AppleScript)
        run: pip3 install dmgbuild

      - name: Build release zip (ad-hoc; no Apple secrets)
        env:
          PINGSTAT_ADHOC_SIGN: "1"
        run: bash scripts/build-release.sh

      - name: Build polished DMG (reuse .app from zip step)
        env:
          PINGSTAT_DMG_NO_OPEN: "1"
          PINGSTAT_DMG_REUSE_APP: "${{ github.workspace }}/dist/PingStat.app"
        run: bash scripts/package-dmg.sh

      - name: Upload build artifacts (zip + dmg)
        uses: actions/upload-artifact@v4
        with:
          name: PingStat-macos-release
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.dmg
