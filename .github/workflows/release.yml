# On version tag push: build ad-hoc Release .app + zip, publish a GitHub Release.
# DMG (polished create-dmg layout) is built locally and uploaded — see scripts/upload-release-dmg.sh.
name: Release build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build release zip (ad-hoc; no Apple secrets)
        env:
          PINGSTAT_ADHOC_SIGN: "1"
        run: bash scripts/build-release.sh

      - name: Upload build artifact (zip)
        uses: actions/upload-artifact@v7
        with:
          name: PingStat-macos-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*.zip
