name: PingStat
options:
  bundleIdPrefix: org.malcomvetter
settings:
  base:
    SWIFT_VERSION: 5.10
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  PingStat:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.malcomvetter.PingStat
        PRODUCT_NAME: PingStat
        PRODUCT_MODULE_NAME: PingStat
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_KEY_CFBundleDisplayName: PingStat
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_STYLE: Automatic
    dependencies: []
  PingStatTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: PingStat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.malcomvetter.PingStatTests
schemes:
  PingStat:
    build:
      targets:
        PingStat: all
        PingStatTests: [test]
    test:
      targets:
        - PingStatTests
